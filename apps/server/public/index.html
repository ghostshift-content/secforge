<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#FAFAF9; --panel:#FFFFFF; --border:#E7E5E4; --border2:#F5F5F4;
    --ink:#1C1917; --ink2:#57534E; --ink3:#A8A29E;
    --accent:#4F46E5; --tint:#EEF2FF; --accent-ink:#4338CA; --accent-brd:#C7D2FE;
    --crit:#DC2626; --high:#EA580C; --med:#D97706; --ok:#16A34A; --info:#0891B2;
    --sh:0 1px 2px rgba(28,25,23,.04), 0 1px 3px rgba(28,25,23,.06);
    --shlg:0 8px 30px rgba(28,25,23,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;}
  .muted{color:var(--ink3);}
  .kicker{font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;}
  a{color:var(--accent);}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .shell{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{min-height:56px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:8px 18px;flex-wrap:wrap;}
  .brand{width:26px;height:26px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brandname{font-weight:700;font-size:15px;letter-spacing:-.01em;}
  .vr{width:1px;height:20px;background:var(--border);flex-shrink:0;}
  .projpill{display:flex;align-items:center;gap:8px;background:var(--border2);border:1px solid var(--border);padding:5px 10px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink);}
  .projpill .mono{font-weight:400;font-size:11px;color:var(--ink3);}
  .enginewrap{display:flex;align-items:center;gap:7px;background:var(--tint);border:1px solid var(--accent-brd);padding:4px 10px 4px 11px;border-radius:7px;}
  .enginewrap label{font-size:11px;font-weight:600;color:var(--accent-ink);}
  .enginewrap select{height:26px;border:0;background:transparent;color:var(--accent-ink);font-weight:600;font-size:12.5px;padding:0 2px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .walkbtn{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:13px;padding:8px 14px;border-radius:8px;box-shadow:var(--sh);text-decoration:none;}
  .walkbtn:hover{background:var(--accent-ink);}
  #live-badge{display:flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;border:1px solid var(--border);font-size:11.5px;font-weight:600;}

  .tabs{min-height:44px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:2px;padding:0 14px;overflow-x:auto;}
  .tab{border:0;background:transparent;color:var(--ink2);font-weight:500;font-size:13.5px;height:43px;padding:0 12px;border-bottom:2px solid transparent;white-space:nowrap;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}

  .content{flex-grow:1;position:relative;}
  .panel{display:none;padding:24px;max-width:1200px;margin:0 auto;}
  .panel.active{display:block;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh);}
  .btn{border:1px solid var(--border);background:var(--panel);color:var(--ink);font-weight:600;font-size:12.5px;padding:0 14px;height:36px;border-radius:8px;}
  .btn:hover{border-color:var(--ink3);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-primary{border:0;background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;padding:0 16px;height:36px;border-radius:8px;box-shadow:var(--sh);}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-primary:disabled{opacity:.5;cursor:default;background:var(--accent);}
  .chip{font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid var(--border);background:var(--border2);color:var(--ink2);}
  .badge{font-size:10.5px;font-weight:700;color:#fff;padding:2px 8px;border-radius:5px;display:inline-block;}
  .b-crit{background:var(--crit);} .b-high{background:var(--high);} .b-med{background:var(--med);} .b-ok{background:var(--ok);} .b-info{background:var(--info);} .b-none{background:var(--ink3);}
  .pill-ok{font-size:11px;font-weight:600;color:var(--ok);background:#F0FDF4;border:1px solid #BBF7D0;padding:2px 9px;border-radius:20px;}
  .pill-warn{font-size:11px;font-weight:600;color:var(--med);background:#FFFBEB;border:1px solid #FDE68A;padding:2px 9px;border-radius:20px;}
  .sd{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block;}
  .scroll{overflow:auto;}
  .scroll::-webkit-scrollbar{width:10px;height:10px;} .scroll::-webkit-scrollbar-thumb{background:#E7E5E4;border-radius:6px;border:3px solid var(--bg);}

  table.grid{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.grid th{background:var(--border2);font-size:10px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:8px 10px;white-space:nowrap;}
  table.grid td{border-top:1px solid var(--border2);padding:8px 10px;vertical-align:top;}
  table.grid tr.clickable{cursor:pointer;}
  table.grid tr.clickable:hover{background:var(--border2);}
  table.grid tr.sel{background:var(--tint);}
  .sechd{font-size:14px;font-weight:700;letter-spacing:-.01em;margin:26px 0 10px;}
  .sechd:first-child{margin-top:0;}
  h1.pagehd{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;}

  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
  @media (max-width:760px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr));} .grid2{grid-template-columns:1fr;}}
  .stat{padding:14px 16px;}
  .stat .n{font-size:24px;font-weight:700;letter-spacing:-.02em;}
  .stat .l{font-size:11.5px;color:var(--ink3);margin-top:2px;}
  .bar-track{height:8px;background:var(--border2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);transition:width .2s;}
  .guard-ok{font-size:11px;background:#F0FDF4;color:#166534;border:1px solid #BBF7D0;padding:1px 7px;border-radius:4px;white-space:nowrap;}
  .guard-warn{font-size:11px;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;padding:1px 7px;border-radius:4px;white-space:nowrap;}

  .seg{display:inline-flex;background:var(--border2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px;}
  .segbtn{border:0;background:transparent;color:var(--ink2);font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:6px;font-family:inherit;height:30px;}
  .segbtn.on{background:var(--panel);color:var(--accent-ink);font-weight:600;box-shadow:var(--sh);}
  .modebox{display:none;} .modebox.on{display:block;}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;max-width:520px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink2);}
  input[type=text],input[type=url],textarea,select{border:1px solid var(--border);border-radius:8px;padding:0 10px;font-family:inherit;font-size:13px;color:var(--ink);background:var(--panel);height:36px;}
  textarea{height:auto;min-height:84px;padding:8px 10px;resize:vertical;line-height:1.5;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .check-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;}
  .check-row input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;}

  .pchip{font-size:12px;padding:6px 11px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--ink2);cursor:pointer;font-family:inherit;}
  .pchip[aria-pressed=true]{border-color:var(--accent);background:var(--tint);color:var(--accent-ink);font-weight:600;}
  .pchipwrap{display:flex;flex-wrap:wrap;gap:7px;}

  .vdot{width:15px;height:15px;border-radius:50%;display:inline-block;}
  .vdot-vuln{background:var(--crit);} .vdot-pass{background:var(--ok);} .vdot-open{background:#fff;border:2px solid var(--med);} .vdot-na{background:var(--border2);border:1px solid var(--border);}
  table.matrix{border-collapse:collapse;min-width:600px;}
  table.matrix th{font-size:10.5px;font-weight:600;color:var(--ink2);padding:6px 5px;text-align:center;vertical-align:bottom;min-width:56px;}
  table.matrix th:first-child{text-align:left;}
  table.matrix td{padding:6px 5px;text-align:center;border-top:1px solid var(--border2);}
  table.matrix td:first-child{text-align:left;font-size:12.5px;font-weight:500;white-space:nowrap;}

  .empty{padding:26px;text-align:center;color:var(--ink3);font-size:13px;}
  .status-msg{font-size:12.5px;margin-top:8px;min-height:1em;}
  .status-msg.err{color:var(--crit);} .status-msg.ok{color:var(--ok);} .status-msg.loading{color:var(--ink3);}
  .hist-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12.5px;}
  .hist-lbl{width:110px;flex-shrink:0;color:var(--ink2);font-weight:500;}
  .hist-track{flex-grow:1;height:14px;background:var(--border2);border-radius:4px;overflow:hidden;}
  .hist-fill{height:100%;background:var(--accent);}
  .hist-n{width:30px;text-align:right;flex-shrink:0;font-family:'IBM Plex Mono',monospace;color:var(--ink3);}
  .split{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
  .split > .main{flex:2 1 480px;min-width:0;}
  .split > .side{flex:1 1 300px;min-width:280px;}
  .kv{font-size:12.5px;line-height:1.9;}
  .kv b{color:var(--ink2);font-weight:600;}
  .proj-row{display:block;width:100%;text-align:left;padding:13px 15px;margin-bottom:8px;cursor:pointer;font-family:inherit;}
  .proj-row:hover{border-color:var(--ink3);}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4-3 7.5-7 9-4-1.5-7-5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></div>
    <div class="brandname">SecForge</div>
    <div class="vr"></div>
    <button class="projpill" id="proj-pill" title="Switch project" type="button">No project open</button>
    <div style="flex-grow:1"></div>
    <div class="enginewrap">
      <label for="engine-select">Engine</label>
      <select id="engine-select" aria-label="Engine"><option>loading…</option></select>
    </div>
    <div id="live-badge" title="backend connection"><span class="sd"></span><span class="mono" id="live-badge-text">checking…</span></div>
    <a class="walkbtn" href="/demo.html" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8z"/></svg>Walkthrough</a>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab" data-tab="home">Home</button>
    <button class="tab" data-tab="map">Map</button>
    <button class="tab" data-tab="assess">Assess</button>
    <button class="tab" data-tab="findings">Findings</button>
    <button class="tab" data-tab="coverage">Coverage</button>
    <button class="tab" data-tab="patterns">Patterns</button>
    <button class="tab" data-tab="memory">Memory</button>
    <button class="tab" data-tab="env">Env</button>
  </div>

  <div class="content">

    <!-- HOME -->
    <div class="panel" data-panel="home">
      <div class="split">
        <div class="main">
          <h1 class="pagehd">Open a project</h1>
          <div class="muted" style="margin-bottom:16px;line-height:1.5;max-width:56ch;">Point SecForge at an absolute source path on this machine. It snapshots the tree and maps it into a knowledge graph — endpoints, services, jobs, data stores — that later views scan and assess.</div>
          <div class="card" style="padding:16px 18px;max-width:640px;">
            <div class="field">
              <label for="home-sourceroot">Source path</label>
              <input type="text" id="home-sourceroot" placeholder="/absolute/path/to/project" autocomplete="off">
            </div>
            <button class="btn-primary" id="home-open-btn" type="button">Open &amp; map</button>
            <div class="status-msg" id="home-status"></div>
          </div>
        </div>
        <div class="side">
          <div class="sechd" style="margin-top:0;">Recent projects</div>
          <div id="home-recent"><div class="empty">Loading…</div></div>
        </div>
      </div>
    </div>

    <!-- MAP -->
    <div class="panel" data-panel="map">
      <div id="map-body"></div>
    </div>

    <!-- ASSESS -->
    <div class="panel" data-panel="assess">
      <div id="assess-body"></div>
    </div>

    <!-- FINDINGS -->
    <div class="panel" data-panel="findings">
      <div id="findings-body"></div>
    </div>

    <!-- COVERAGE -->
    <div class="panel" data-panel="coverage">
      <div id="coverage-body"></div>
    </div>

    <!-- PATTERNS -->
    <div class="panel" data-panel="patterns">
      <div id="patterns-body"></div>
    </div>

    <!-- MEMORY -->
    <div class="panel" data-panel="memory">
      <div id="memory-body"></div>
    </div>

    <!-- ENV -->
    <div class="panel" data-panel="env">
      <div id="env-body"></div>
    </div>

  </div>
</div>

<script>
'use strict';

// ---------- state ----------
const state = {
  project: null,   // {id,name,sourceRoot,createdAt}
  session: null,   // {sessionId,...}
  engine: null,    // selected engine id
  engines: [],
  graph: null,     // {nodes,edges}
  mapResult: null, // {status,snapshotId,features,coverage,nodeCount,edgeCount}
  familiesCache: null,
  findingsCache: null,
  selectedFindingId: null,
};

const PROJECT_TABS = ['map', 'assess', 'findings', 'coverage', 'memory', 'env'];

// ---------- helpers ----------
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"'/]/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#47;',
  }[c]));
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { 'content-type': 'application/json' } }, opts));
  let body = null;
  try { body = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) throw new Error((body && body.error) || res.statusText || ('HTTP ' + res.status));
  return body;
}

function setStatus(id, msg, kind) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'status-msg' + (kind ? ' ' + kind : '');
}

function fileLine(claims) {
  const c = Array.isArray(claims) && claims[0];
  return c ? esc(c.file) + ':' + esc(c.line) : '—';
}

function guardHtml(tabLabel) {
  return '<div class="empty">Open a project first — go to <a href="#" data-goto="home">Home</a> and open &amp; map a source tree'
    + (tabLabel ? ' to use ' + esc(tabLabel) : '') + '.</div>';
}

function severityClass(sev) {
  const s = String(sev || '').toLowerCase();
  if (s.includes('crit')) return 'b-crit';
  if (s.includes('high')) return 'b-high';
  if (s.includes('med')) return 'b-med';
  if (s.includes('low')) return 'b-ok';
  if (s.includes('info')) return 'b-info';
  return 'b-none';
}

function cweText(cwe) {
  if (Array.isArray(cwe)) return cwe.join(', ');
  return cwe || '—';
}

// ---------- router ----------
function go(tab) {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('active', p.dataset.panel === tab));
  const renderers = {
    home: renderHome, map: renderMap, assess: renderAssess, findings: renderFindings,
    coverage: renderCoverage, patterns: renderPatterns, memory: renderMemory, env: renderEnv,
  };
  if (renderers[tab]) renderers[tab]();
}

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (btn) go(btn.dataset.tab);
});
document.getElementById('proj-pill').addEventListener('click', () => go('home'));
document.addEventListener('click', (e) => {
  const link = e.target.closest('[data-goto]');
  if (link) { e.preventDefault(); go(link.dataset.goto); }
});

// ---------- top bar: health + engines ----------
async function pollHealth() {
  const badge = document.getElementById('live-badge');
  const text = document.getElementById('live-badge-text');
  try {
    const r = await api('/api/health');
    badge.style.background = '#F0FDF4'; badge.style.borderColor = '#BBF7D0';
    badge.querySelector('.sd').style.background = 'var(--ok)';
    text.textContent = r && r.ok ? 'live' : 'offline';
    text.style.color = '#166534';
  } catch (e) {
    badge.style.background = '#FEF2F2'; badge.style.borderColor = '#FECACA';
    badge.querySelector('.sd').style.background = 'var(--crit)';
    text.textContent = 'offline';
    text.style.color = '#991B1B';
  }
}

async function loadEngines() {
  const sel = document.getElementById('engine-select');
  try {
    const engines = await api('/api/engines');
    state.engines = Array.isArray(engines) ? engines : [];
    sel.innerHTML = state.engines.map((e) =>
      '<option value="' + esc(e.id) + '">' + esc(e.label || e.id) + (e.available ? '' : ' — not configured') + '</option>'
    ).join('') || '<option value="">no engines</option>';
    const def = state.engines.find((e) => e.default) || state.engines[0];
    if (def) { sel.value = def.id; state.engine = def.id; }
  } catch (e) {
    sel.innerHTML = '<option value="">unavailable</option>';
  }
}
document.getElementById('engine-select').addEventListener('change', (e) => { state.engine = e.target.value; });

// ---------- project open / map ----------
function updateProjectPill() {
  const pill = document.getElementById('proj-pill');
  pill.innerHTML = state.project
    ? esc(state.project.name) + ' <span class="mono">@ ' + esc(String(state.project.id).slice(0, 8)) + '</span>'
    : 'No project open';
}

async function openAndMap(sourceRoot) {
  setStatus('home-status', 'Opening project…', 'loading');
  try {
    const opened = await api('/api/projects', { method: 'POST', body: JSON.stringify({ sourceRoot }) });
    state.project = opened.project;
    state.session = opened.session;
    updateProjectPill();
    setStatus('home-status', 'Mapping source tree…', 'loading');
    const mapResult = await api('/api/projects/' + encodeURIComponent(state.project.id) + '/map', { method: 'POST' });
    state.mapResult = mapResult;
    state.graph = await api('/api/projects/' + encodeURIComponent(state.project.id) + '/graph');
    setStatus('home-status', '', '');
    go('map');
  } catch (e) {
    setStatus('home-status', 'Failed: ' + e.message, 'err');
  }
}

document.getElementById('home-open-btn').addEventListener('click', () => {
  const v = document.getElementById('home-sourceroot').value.trim();
  if (!v) { setStatus('home-status', 'Enter a source path first.', 'err'); return; }
  openAndMap(v);
});

async function renderHome() {
  const box = document.getElementById('home-recent');
  box.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await api('/api/projects');
    const projects = (r && r.projects) || [];
    if (!projects.length) { box.innerHTML = '<div class="empty">No projects yet.</div>'; return; }
    box.innerHTML = projects.map((p) =>
      '<button class="card proj-row" data-open-project="' + esc(p.sourceRoot) + '" type="button">'
      + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-weight:600;">' + esc(p.name) + '</span>'
      + '<span class="mono chip">@ ' + esc(String(p.id).slice(0, 8)) + '</span></div>'
      + '<div class="mono muted" style="font-size:11px;margin-top:4px;">' + esc(p.sourceRoot) + '</div>'
      + '</button>'
    ).join('');
  } catch (e) {
    box.innerHTML = '<div class="empty">Could not load projects: ' + esc(e.message) + '</div>';
  }
}
document.getElementById('home-recent').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-open-project]');
  if (btn) openAndMap(btn.dataset.openProject);
});

// ---------- MAP ----------
async function renderMap() {
  const body = document.getElementById('map-body');
  if (!state.project) { body.innerHTML = guardHtml('Map'); return; }
  body.innerHTML = '<div class="empty">Loading map…</div>';
  try {
    if (!state.mapResult) state.mapResult = await api('/api/projects/' + encodeURIComponent(state.project.id) + '/map', { method: 'POST' });
    if (!state.graph) state.graph = await api('/api/projects/' + encodeURIComponent(state.project.id) + '/graph');
    body.innerHTML = mapHtml();
    wireMapEvents();
  } catch (e) {
    body.innerHTML = '<div class="empty">Could not load map: ' + esc(e.message) + '</div>';
  }
}

function mapHtml() {
  const m = state.mapResult || {};
  const features = m.features || [];
  const nodes = (state.graph && state.graph.nodes) || [];
  const edges = (state.graph && state.graph.edges) || [];
  return '<div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;">'
    + '<h1 class="pagehd">Map</h1><button class="btn" id="map-remap-btn" type="button">Re-map</button></div>'
    + '<div class="grid4" style="margin:14px 0 22px;">'
    + statCard(features.length, 'features') + statCard(m.nodeCount != null ? m.nodeCount : nodes.length, 'nodes')
    + statCard(m.edgeCount != null ? m.edgeCount : edges.length, 'edges')
    + statCard((m.coverage && m.coverage.technical != null ? m.coverage.technical : '—') + '%', 'technical coverage')
    + '</div>'
    + '<div class="sechd">Features</div>' + featuresTableHtml(features)
    + '<div class="sechd">Endpoints</div>' + endpointsTableHtml(nodes, edges)
    + '<div class="sechd">Node types</div>' + histogramHtml(nodes);
}

function statCard(n, l) {
  return '<div class="card stat"><div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + '</div></div>';
}

function featuresTableHtml(features) {
  if (!features.length) return '<div class="empty">No features mapped.</div>';
  const rows = features.map((f) => {
    const c = f.counts || {};
    return '<tr><td>' + esc(f.name) + '</td><td class="mono muted">' + esc(f.slug || '') + '</td>'
      + '<td>' + esc(c.endpoints || 0) + '</td><td>' + esc(c.services || 0) + '</td>'
      + '<td>' + esc(c.jobs || 0) + '</td><td>' + esc(c.dataStores || 0) + '</td><td>' + esc(c.files || 0) + '</td></tr>';
  }).join('');
  return '<div class="card scroll"><table class="grid"><thead><tr><th>Name</th><th>Slug</th><th>Endpoints</th><th>Services</th><th>Jobs</th><th>Data stores</th><th>Files</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function endpointGuarded(nodeId, edges) {
  return edges.some((e) => (e.src === nodeId || e.dst === nodeId) && /AUTHORIZ|AUTHENTICAT/i.test(e.type || ''));
}

function endpointsTableHtml(nodes, edges) {
  const eps = nodes.filter((n) => n.type === 'ENDPOINT');
  if (!eps.length) return '<div class="empty">No endpoints found.</div>';
  const rows = eps.map((n) => {
    const d = n.data || {};
    const guarded = endpointGuarded(n.id, edges);
    return '<tr><td class="mono">' + esc(d.method || '') + '</td><td class="mono">' + esc(d.route || n.name || '') + '</td>'
      + '<td class="mono muted">' + fileLine(n.claims) + '</td>'
      + '<td>' + (guarded ? '<span class="guard-ok">guarded</span>' : '<span class="guard-warn">no guard</span>') + '</td></tr>';
  }).join('');
  return '<div class="card scroll"><table class="grid"><thead><tr><th>Method</th><th>Route</th><th>File:line</th><th>Guard</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function histogramHtml(nodes) {
  const counts = {};
  nodes.forEach((n) => { counts[n.type] = (counts[n.type] || 0) + 1; });
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '<div class="empty">No nodes yet.</div>';
  const max = entries[0][1] || 1;
  return '<div class="card" style="padding:14px 16px;">' + entries.map(([type, n]) =>
    '<div class="hist-row"><div class="hist-lbl mono">' + esc(type) + '</div>'
    + '<div class="hist-track"><div class="hist-fill" style="width:' + Math.round((n / max) * 100) + '%"></div></div>'
    + '<div class="hist-n">' + n + '</div></div>'
  ).join('') + '</div>';
}

function wireMapEvents() {
  const btn = document.getElementById('map-remap-btn');
  if (btn) btn.addEventListener('click', async () => {
    state.mapResult = null; state.graph = null;
    renderMap();
  });
}

// ---------- ASSESS ----------
const assessState = { scopeMode: 'all', method: 'pattern', families: new Set() };

async function renderAssess() {
  const body = document.getElementById('assess-body');
  if (!state.project) { body.innerHTML = guardHtml('Assess'); return; }
  const features = (state.graph && state.graph.nodes || []).filter((n) => n.type === 'FEATURE')
    .map((n) => ({ id: n.id, name: n.name }))
    .concat((state.mapResult && state.mapResult.features || []).map((f) => ({ id: f.slug || f.id, name: f.name })));
  const uniqueFeatures = [];
  const seen = new Set();
  features.forEach((f) => { if (!seen.has(f.id)) { seen.add(f.id); uniqueFeatures.push(f); } });

  let families = state.familiesCache;
  if (!families) {
    try { families = (await api('/api/patterns')).families || []; state.familiesCache = families; }
    catch (e) { families = []; }
  }

  body.innerHTML = assessHtml(uniqueFeatures, families);
  wireAssessEvents(families);
}

function assessHtml(features, families) {
  return '<h1 class="pagehd">Assess</h1><div class="muted" style="margin-bottom:18px;">Choose scope, method, and engine, then run the pipeline.</div>'
    + '<div class="card" style="padding:18px 20px;max-width:760px;">'
    + '<div class="sechd" style="margin-top:0;">Scope</div>'
    + '<div class="seg" id="scope-seg"><button class="segbtn on" data-scope="all" type="button">All features</button><button class="segbtn" data-scope="feature" type="button">One feature</button></div>'
    + '<div class="field" id="scope-feature-box" style="display:none;margin-top:10px;"><label for="assess-feature">Feature</label>'
    + '<select id="assess-feature">' + (features.length ? features.map((f) => '<option value="' + esc(f.id) + '">' + esc(f.name) + '</option>').join('') : '<option value="">no features mapped</option>') + '</select></div>'

    + '<div class="sechd">Method</div>'
    + '<div class="seg" id="method-seg"><button class="segbtn on" data-method="pattern" type="button">Pattern</button><button class="segbtn" data-method="prompt" type="button">Prompt</button><button class="segbtn" data-method="full" type="button">Full sweep</button></div>'
    + '<div class="modebox on" id="mode-pattern" style="margin-top:10px;">' + (families.length
      ? '<div class="pchipwrap">' + families.map((f) => '<button class="pchip" type="button" aria-pressed="false" data-family="' + esc(f.prefix) + '">' + esc(f.prefix) + ' · ' + esc(f.name) + '</button>').join('') + '</div>'
      : '<div class="muted" style="font-size:12.5px;">No pattern families loaded.</div>') + '</div>'
    + '<div class="modebox" id="mode-prompt" style="margin-top:10px;"><textarea id="assess-prompt" placeholder="Describe what to look for…"></textarea></div>'
    + '<div class="modebox" id="mode-full" style="margin-top:10px;"><div class="muted" style="font-size:12.5px;">Runs every pattern family across the chosen scope.</div></div>'

    + '<div class="sechd">Engine</div>'
    + '<div class="muted" style="font-size:12.5px;margin-bottom:10px;">Using <b class="mono" id="assess-engine-label">' + esc(state.engine || '—') + '</b> — change it in the top bar.</div>'

    + '<button class="btn-primary" id="assess-run-btn" type="button" style="margin-top:6px;">Run assessment</button>'
    + '<div class="status-msg" id="assess-status"></div>'
    + '</div>'
    + '<div id="assess-results" style="margin-top:22px;"></div>';
}

function wireAssessEvents(families) {
  document.getElementById('scope-seg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-scope]'); if (!b) return;
    assessState.scopeMode = b.dataset.scope;
    document.querySelectorAll('#scope-seg .segbtn').forEach((x) => x.classList.toggle('on', x === b));
    document.getElementById('scope-feature-box').style.display = assessState.scopeMode === 'feature' ? 'flex' : 'none';
  });
  document.getElementById('method-seg').addEventListener('click', (e) => {
    const b = e.target.closest('[data-method]'); if (!b) return;
    assessState.method = b.dataset.method;
    document.querySelectorAll('#method-seg .segbtn').forEach((x) => x.classList.toggle('on', x === b));
    ['pattern', 'prompt', 'full'].forEach((m) => document.getElementById('mode-' + m).classList.toggle('on', m === assessState.method));
  });
  const pbox = document.getElementById('mode-pattern');
  pbox.addEventListener('click', (e) => {
    const b = e.target.closest('[data-family]'); if (!b) return;
    const on = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', String(!on));
    if (on) assessState.families.delete(b.dataset.family); else assessState.families.add(b.dataset.family);
  });
  document.getElementById('assess-run-btn').addEventListener('click', runAssess);
}

function buildScope() {
  const scope = { mode: assessState.scopeMode, method: assessState.method };
  if (scope.mode === 'feature') scope.feature = document.getElementById('assess-feature').value;
  if (scope.method === 'pattern') scope.patterns = Array.from(assessState.families);
  if (scope.method === 'prompt') scope.prompt = document.getElementById('assess-prompt').value;
  return scope;
}

async function runAssess() {
  if (!state.session) { setStatus('assess-status', 'No active session.', 'err'); return; }
  const btn = document.getElementById('assess-run-btn');
  btn.disabled = true;
  setStatus('assess-status', 'Running…', 'loading');
  document.getElementById('assess-results').innerHTML = '';
  try {
    const scope = buildScope();
    const url = '/api/sessions/' + encodeURIComponent(state.session.sessionId) + '/scan?project=' + encodeURIComponent(state.project.id);
    const result = await api(url, { method: 'POST', body: JSON.stringify({ scope, engine: state.engine }) });
    setStatus('assess-status', 'Done.', 'ok');
    document.getElementById('assess-results').innerHTML = assessResultsHtml(result);
    state.findingsCache = null; // findings likely changed
  } catch (e) {
    setStatus('assess-status', 'Failed: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function assessResultsHtml(r) {
  const candidates = r.candidates || [];
  const findings = r.findings || [];
  const jobs = r.jobs != null ? r.jobs : '—';
  const engineUsed = r.engineUsed || state.engine || '—';
  let html = '<div class="grid4">' + statCard(jobs, 'jobs') + statCard(candidates.length, 'candidates')
    + statCard(findings.length, 'findings') + statCard(engineUsed, 'engine used') + '</div>';
  html += '<div class="sechd">Candidates</div>';
  if (!candidates.length) {
    html += '<div class="empty">No candidates produced.' + (findings.length ? ' See <a href="#" data-goto="findings">Findings</a>.' : '') + '</div>';
  } else {
    html += '<div class="card scroll"><table class="grid"><thead><tr><th>Family</th><th>CWE</th><th>Title</th><th>Feature</th><th>Endpoint</th></tr></thead><tbody>'
      + candidates.map((c) => '<tr><td class="mono">' + esc(c.family || '—') + '</td><td class="mono">' + esc(cweText(c.cwe)) + '</td>'
        + '<td>' + esc(c.title || c.name || '—') + '</td><td>' + esc(c.feature || '—') + '</td>'
        + '<td class="mono">' + esc(c.route || c.endpoint || '—') + '</td></tr>').join('')
      + '</tbody></table></div>';
  }
  return html;
}

function renderFindingDetail(id) {
  const f = (state.findingsCache || []).find((x) => x.id === id);

    + '<div><b>Feature</b> ' + esc(f.feature || '—') + '</div>'
    + '<div><b>Endpoint</b> <span class="mono">' + esc(f.method || '') + ' ' + esc(f.route || f.endpoint || '—') + '</span></div>'
    + '<div><b>Evidence</b> <span class="mono">' + (f.evidence ? esc(f.evidence.file) + ':' + esc(f.evidence.line) : '—') + '</span></div>'

    + '<button class="btn-primary" id="validate-btn" type="button" style="margin-top:12px;">Validate live</button>'

async function validateFinding(id) {
  setStatus('validate-result', 'Validating…', 'loading');
  try {
    const url = '/api/findings/' + encodeURIComponent(id) + '/validate?project=' + encodeURIComponent(state.project.id);
    const r = await api(url, { method: 'POST', body: JSON.stringify({ dryRun: false }) });
    const parts = Object.keys(r || {}).map((k) => '<b>' + esc(k) + '</b>: ' + esc(typeof r[k] === 'object' ? JSON.stringify(r[k]) : r[k]));
    document.getElementById('validate-result').innerHTML = parts.join('<br>');
    document.getElementById('validate-result').className = 'status-msg ' + (r && r.ran ? 'ok' : '');
  } catch (e) {
    setStatus('validate-result', 'Failed: ' + e.message, 'err');
  }
}

function coverageHtml(c) {

    + '<div class="card" style="padding:16px 18px;margin:14px 0 22px;max-width:520px;">'

  html += '<div class="sechd">Feature × family matrix</div>';

    html += '<div class="empty">No coverage data yet — run an assessment.</div>';
  } else {
    html += '<div class="card scroll"><table class="matrix"><thead><tr><th>Feature</th>' + families.map((f) => '<th>' + esc(f) + '</th>').join('') + '</tr></thead><tbody>'
      + matrix.map((row) => {
        const cellMap = new Map((row.cells || []).map((c2) => [c2.family, c2.verdict]));
        return '<tr><td>' + esc(row.name || row.feature) + '</td>' + families.map((f) => {
          const v = cellMap.get(f) || 'na';
          return '<td><span class="vdot vdot-' + esc(v) + '" title="' + esc(v) + '"></span></td>';

      }).join('')

      + '<span><span class="vdot vdot-open"></span> open</span><span><span class="vdot vdot-na"></span> n/a</span></div>';
  }

  html += '<div class="sechd">By CWE</div>';
  html += byCwe.length
    ? '<div class="card" style="padding:6px 0;">' + byCwe.map((x) => '<div class="row" style="justify-content:space-between;padding:8px 16px;border-top:1px solid var(--border2);"><span class="mono">' + esc(x.cwe) + '</span><span class="chip">' + esc(x.count) + '</span></div>').join('') + '</div>'

let patternsCardsCache = null;
async function renderPatterns() {
  const body = document.getElementById('patterns-body');
  body.innerHTML = '<div class="empty">Loading patterns…</div>';
  try {
    const [famRes, cardsRes, cweRes] = await Promise.all([
      api('/api/patterns'), api('/api/patterns/cards'), api('/api/cwe'),
    ]);
    const families = famRes.families || [];
    const cards = cardsRes.cards || [];
    const cwe = cweRes.cwe || [];
    patternsCardsCache = cards;
    body.innerHTML = patternsHtml(families, cards, cwe);
    wirePatternsEvents();
  } catch (e) {
    body.innerHTML = '<div class="empty">Could not load patterns: ' + esc(e.message) + '</div>';

}

function patternsHtml(families, cards, cwe) {
  let html = '<h1 class="pagehd">Patterns</h1>';
  html += '<div class="sechd" style="margin-top:14px;">Families</div>';
  html += '<div class="pchipwrap">' + families.map((f) => '<span class="chip" title="' + esc((f.cwe || []).join(', ')) + '">' + esc(f.prefix) + ' · ' + esc(f.name) + ' (' + esc(f.count) + ')</span>').join('') + '</div>';

  html += '<div class="sechd">Cards</div>';
  html += '<div class="field" style="margin-bottom:10px;"><input type="text" id="cards-search" placeholder="Search cards…"></div>';
  html += '<div id="cards-list">' + cardsListHtml(cards, '') + '</div>';

  html += '<div class="sechd">CWE catalog</div>';
  html += cwe.length
    ? '<div class="card scroll"><table class="grid"><thead><tr><th>CWE</th><th>Name</th><th>Families</th></tr></thead><tbody>'
      + cwe.map((x) => '<tr><td class="mono">' + esc(x.id) + '</td><td>' + esc(x.name) + '</td><td class="mono muted">' + esc((x.families || []).join(', ')) + '</td></tr>').join('')
      + '</tbody></table></div>'
    : '<div class="empty">No CWE catalog loaded.</div>';
  return html;
}

function cardsListHtml(cards, q) {
  const filtered = q ? cards.filter((c) => (c.title || '').toLowerCase().includes(q) || (c.family || '').toLowerCase().includes(q) || (c.id || '').toLowerCase().includes(q)) : cards;
  if (!filtered.length) return '<div class="empty">No matching cards.</div>';
  const groups = new Map();
  filtered.forEach((c) => { const k = c.family || '—'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); });
  return Array.from(groups.entries()).map(([fam, items]) =>
    '<div class="sechd" style="font-size:12.5px;margin:16px 0 6px;">' + esc(fam) + '</div>'
    + '<div class="pchipwrap">' + items.map((c) => '<span class="chip mono" title="' + esc(c.id) + '">' + esc(c.title || c.id) + '</span>').join('') + '</div>'
  ).join('');
}

function wirePatternsEvents() {
  document.getElementById('cards-search').addEventListener('input', (e) => {
    document.getElementById('cards-list').innerHTML = cardsListHtml(patternsCardsCache || [], e.target.value.trim().toLowerCase());
  });

    box.innerHTML = '<div class="empty">Searching…</div>';
    try {
      const r = await api('/api/projects/' + encodeURIComponent(state.project.id) + '/memory?q=' + encodeURIComponent(q));
      box.innerHTML = memoryResultsHtml(r);
    } catch (e) {
      box.innerHTML = '<div class="empty">Search failed: ' + esc(e.message) + '</div>';
    }
  });
  document.getElementById('mem-save-btn').addEventListener('click', async () => {
    const payload = {
      name: document.getElementById('mem-name').value.trim(),
      kind: document.getElementById('mem-kind').value,
      family: document.getElementById('mem-family').value.trim() || null,
      note: document.getElementById('mem-note').value.trim() || null,
    };
    if (!payload.name) { setStatus('mem-status', 'Name is required.', 'err'); return; }
    setStatus('mem-status', 'Saving…', 'loading');
    try {
      await api('/api/projects/' + encodeURIComponent(state.project.id) + '/memory', { method: 'POST', body: JSON.stringify(payload) });
      setStatus('mem-status', 'Saved.', 'ok');
    } catch (e) {
      setStatus('mem-status', 'Failed: ' + e.message, 'err');
    }
  });
}

function memoryResultsHtml(r) {
  const hits = (r && r.recall && r.recall.hits) || [];
  const cross = (r && r.cross) || [];
  let html = '<div class="sechd" style="margin-top:0;font-size:12.5px;">This project</div>';
  html += hits.length
    ? '<div class="card" style="padding:10px 14px;">' + hits.map((h) => '<div class="mono" style="font-size:12px;padding:4px 0;border-top:1px solid var(--border2);">' + esc(h) + '</div>').join('') + '</div>'
    : '<div class="empty">No matches.</div>';
  html += '<div class="sechd" style="font-size:12.5px;">Across projects</div>';
  html += cross.length
    ? '<div class="card" style="padding:10px 14px;">' + cross.map((c) => '<div style="font-size:12px;padding:4px 0;border-top:1px solid var(--border2);"><span class="chip mono">' + esc(String(c.project).slice(0, 8)) + '</span> <span class="mono">' + esc(c.hit) + '</span></div>').join('') + '</div>'
    : '<div class="empty">No cross-project matches.</div>';
  return html;
}

// ---------- ENV ----------
async function renderEnv() {
  const body = document.getElementById('env-body');
  if (!state.project) { body.innerHTML = guardHtml('Env'); return; }
  body.innerHTML = '<div class="empty">Loading target…</div>';
  try {
    const r = await api('/api/projects/' + encodeURIComponent(state.project.id) + '/env');
    body.innerHTML = envHtml(r.target || null);
    wireEnvEvents();
  } catch (e) {
    body.innerHTML = '<div class="empty">Could not load env: ' + esc(e.message) + '</div>';
  }
}

function envHtml(target) {
  let html = '<h1 class="pagehd">Env</h1><div class="muted" style="margin-bottom:16px;max-width:60ch;">Register a live target to allow dynamic validation of findings. Validation stays static-only until a target is registered and marked authorized.</div>';
  html += '<div class="sechd" style="margin-top:0;">Current target</div>';
  html += target
    ? '<div class="card kv" style="padding:14px 16px;max-width:520px;"><div><b>Base URL</b> <span class="mono">' + esc(target.baseUrl) + '</span></div>'
      + '<div><b>Scope</b> <span class="mono">' + esc((target.scope || []).join(', ') || '—') + '</span></div>'
      + '<div><b>Authorized</b> ' + (target.authorized ? '<span class="pill-ok">yes</span>' : '<span class="pill-warn">no</span>') + '</div></div>'
    : '<div class="empty">No target registered.</div>';

  html += '<div class="sechd">Register / update target</div>'
    + '<div class="card" style="padding:16px 18px;max-width:520px;">'
    + '<div class="field"><label for="env-baseurl">Base URL</label><input type="url" id="env-baseurl" placeholder="https://staging.example.com" value="' + (target ? esc(target.baseUrl) : '') + '"></div>'
    + '<div class="field"><label for="env-authheader">Auth header (optional)</label><input type="text" id="env-authheader" placeholder="Authorization: Bearer …" value="' + (target && target.authHeader ? esc(target.authHeader) : '') + '"></div>'
    + '<div class="field"><label for="env-scope">Scope (comma-separated paths)</label><input type="text" id="env-scope" placeholder="/api/*" value="' + (target ? esc((target.scope || []).join(', ')) : '') + '"></div>'
    + '<div class="check-row" style="margin-bottom:14px;"><input type="checkbox" id="env-authorized"' + (target && target.authorized ? ' checked' : '') + '><label for="env-authorized">I am authorized to test this target</label></div>'
    + '<button class="btn-primary" id="env-save-btn" type="button">Save target</button>'
    + '<div class="status-msg" id="env-status"></div>'
    + '</div>';
  return html;
}

function wireEnvEvents() {
  document.getElementById('env-save-btn').addEventListener('click', async () => {
    const payload = {
      baseUrl: document.getElementById('env-baseurl').value.trim(),
      authHeader: document.getElementById('env-authheader').value.trim() || undefined,
      scope: document.getElementById('env-scope').value.split(',').map((s) => s.trim()).filter(Boolean),
      authorized: document.getElementById('env-authorized').checked,
    };
    if (!payload.baseUrl) { setStatus('env-status', 'Base URL is required.', 'err'); return; }
    setStatus('env-status', 'Saving…', 'loading');
    try {
      await api('/api/projects/' + encodeURIComponent(state.project.id) + '/env', { method: 'POST', body: JSON.stringify(payload) });
      setStatus('env-status', 'Saved.', 'ok');
      renderEnv();
    } catch (e) {
      setStatus('env-status', 'Failed: ' + e.message, 'err');
    }
  });
}

// ---------- init ----------
(function init() {
  pollHealth();
  setInterval(pollHealth, 20000);
  loadEngines();
  updateProjectPill();
  go('home');
})();
</script>
</body>
